[workspace]
resolver = "2"
members = [
    "crates/optea-sys",
    "crates/optea-core",
    "crates/optea-metrics",
    "crates/optea-game",
    "crates/optea-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/tav08/OPTEA"

[workspace.dependencies]
optea-sys = { path = "crates/optea-sys" }
optea-core = { path = "crates/optea-core" }
optea-metrics = { path = "crates/optea-metrics" }
optea-game = { path = "crates/optea-game" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
sha2 = "0.10"

[workspace.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Com",
    "Win32_System_Wmi",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_System_Services",
    "Win32_Security",
    "Win32_Devices_Display",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
